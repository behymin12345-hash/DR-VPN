name: Build-Docker

on:
    release:
        types: [created]
    workflow_dispatch:

env:
    # DR-VPN: publish to GHCR under this repository only (Docker Hub publishing
    # requires upstream credentials and is intentionally not configured).
    IMAGE_NAME: ${{ github.repository }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Exact changelog tool version: bump this single value to upgrade.
    CHANGELOGEN_VERSION: 0.6.2

jobs:
    generate-changelog:
        if: ${{ github.event_name == 'release' }}
        runs-on: ubuntu-latest
        # Only this job rewrites release notes (`gh release edit`).
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Determine version range
              id: tags
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CURRENT_IS_PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  current_tag="${GITHUB_REF_NAME}"
                  prev_tag=""

                  if [ "${CURRENT_IS_PRERELEASE}" != "true" ]; then
                    prev_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                      | jq -rs --arg current_tag "$current_tag" '
                          [.[][] | select(.draft == false and .prerelease == false and .tag_name != $current_tag) | .tag_name][0] // empty
                        ')"
                  fi

                  if [ -z "$prev_tag" ]; then
                    prev_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
                  fi

                  if [ -z "$prev_tag" ]; then
                    prev_tag="$(git rev-list --max-parents=0 HEAD)"
                  fi

                  echo "previous=$prev_tag" >> "$GITHUB_OUTPUT"
                  echo "current=$current_tag" >> "$GITHUB_OUTPUT"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Generate changelog
              run: |
                  bunx "changelogen@${CHANGELOGEN_VERSION}" --no-authors --from "${{ steps.tags.outputs.previous }}" --to "${{ steps.tags.outputs.current }}" \
                    | grep -v "Generating changelog for " \
                    | sed -e '/^\[log\]/d' -e '/./,$!d' > CHANGELOG.md

            - name: Add GitHub contributors
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}
                  CURRENT_TAG: ${{ steps.tags.outputs.current }}
              run: |
                  contributors=()
                  conventional_re='(feat|perf|fix|refactor|docs|build|types|chore|examples|test|style|ci)(\([^)]+\))?!?:[[:space:]]'
                  while IFS=$'\t' read -r sha subject; do
                    if [[ "$subject" =~ $conventional_re ]]; then
                      if [[ "${BASH_REMATCH[1]}" == chore && ( "${BASH_REMATCH[2]}" == '(deps)' || "${BASH_REMATCH[2]}" == '(release)' ) ]]; then
                        continue
                      fi
                      login="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.author.login // empty')"
                      if [[ -n "$login" && "$login" != *'[bot]' ]]; then
                        contributors+=("$login")
                      fi
                    fi
                  done < <(git log "${PREVIOUS_TAG}...${CURRENT_TAG}" --format='%H%x09%s')

                  if (( ${#contributors[@]} )); then
                    # Plain @mentions also make GitHub render its native Contributors avatar row.
                    printf '\n### Contributors\n\n' >> CHANGELOG.md
                    printf '%s\n' "${contributors[@]}" | sort -fu | sed 's/^/- @/' >> CHANGELOG.md
                  fi

            - name: Update release notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release edit "${{ github.event.release.tag_name }}" --notes-file CHANGELOG.md

            - name: Upload changelog artifact
              uses: actions/upload-artifact@v7
              with:
                  name: changelog
                  path: CHANGELOG.md
                  retention-days: 7

    build-dashboard:
        runs-on: ubuntu-latest
        # Builds the frontend; attaches it to the release so the native
        # installer can deploy the dashboard without a Node toolchain.
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              working-directory: ./dashboard
              run: bun install --frozen-lockfile

            - name: Build dashboard
              run: ./build_dashboard.sh

            - name: Upload dashboard build
              uses: actions/upload-artifact@v7
              with:
                  name: dashboard-build
                  path: ./dashboard/build/
                  retention-days: 1

            - name: Attach dashboard build to the release
              if: ${{ github.event_name == 'release' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd dashboard
                  zip -qr ../dashboard-build.zip build
                  gh release upload "${{ github.event.release.tag_name }}" ../dashboard-build.zip --clobber --repo "${{ github.repository }}"

    build-images:
        needs: build-dashboard
        strategy:
            matrix:
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        # Pushes arch images to GHCR with the workflow token.
        permissions:
            contents: read
            packages: write
        steps:
            - name: Prepare lowercase GHCR image name
              run: echo "IMAGE=ghcr.io/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

            - name: Checkout
              uses: actions/checkout@v7

            - name: Download dashboard build
              uses: actions/download-artifact@v8
              with:
                  name: dashboard-build
                  path: ./dashboard/build/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.arch }} image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  file: ./Dockerfile
                  tags: |
                      ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    push-manifest:
        needs: [build-images]
        runs-on: ubuntu-latest
        # Creates the multi-arch manifests on GHCR.
        permissions:
            contents: read
            packages: write
        steps:
            - name: Prepare lowercase GHCR image name
              run: echo "IMAGE=ghcr.io/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create tagged manifest
              run: |
                  docker buildx imagetools create \
                    -t "${{ env.IMAGE }}:${{ github.ref_name }}" \
                    "${{ env.IMAGE }}:${{ github.ref_name }}-amd64" \
                    "${{ env.IMAGE }}:${{ github.ref_name }}-arm64"
                  docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.ref_name }}"

            - name: Create latest manifest if not prerelease
              if: ${{ github.event_name == 'release' && github.event.release.prerelease != true }}
              run: |
                  docker buildx imagetools create \
                    -t "${{ env.IMAGE }}:latest" \
                    "${{ env.IMAGE }}:${{ github.ref_name }}-amd64" \
                    "${{ env.IMAGE }}:${{ github.ref_name }}-arm64"
                  docker buildx imagetools inspect "${{ env.IMAGE }}:latest"
